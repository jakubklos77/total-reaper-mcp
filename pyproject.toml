[project]
name = "reaper-mcp"
version = "2.0.0"
description = "MCP server for the REAPER DAW: curated, live-tested tools over a file bridge"
requires-python = ">=3.10"
dependencies = ["mcp>=1.20"]

[project.optional-dependencies]
test = ["pytest>=8", "lupa>=2"]

[project.scripts]
reaper-mcp = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
